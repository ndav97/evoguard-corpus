  "status": "active",
  "description": "Elegir la moneda en que se muestran el total y los presupuestos. Un selector de moneda de visualización ofrece EUR (valor inicial), USD y GBP. El total del mes en la moneda elegida es el total en EUR (calculado como hasta ahora) dividido por la tasa de esa moneda y redondeado al céntimo (0,5 hacia arriba), seguido del código de la moneda. En los presupuestos, lo gastado en EUR y el presupuesto en EUR se convierten igual, cada uno por separado; la marca «Excedido» se sigue decidiendo con los importes en EUR. Los gastos de la lista conservan su importe y su moneda originales. Con EUR todo se ve como antes.",
