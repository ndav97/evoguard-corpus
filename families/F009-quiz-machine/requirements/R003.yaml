  "description": "En la pantalla final, un botón «Revisar» muestra la lista «Revisión» con un ítem por pregunta, en el orden en que se presentaron. Cada ítem comienza con el ID de la pregunta seguido de «Correcta» o «Incorrecta», e indica la opción elegida («Elegida: <texto>») y la correcta («Respuesta correcta: <texto>»). Antes del final no hay botón «Revisar», y en el final la lista no se muestra hasta pulsarlo. Reiniciar oculta la revisión, y la revisión de un cuestionario nuevo solo refleja sus respuestas.",
