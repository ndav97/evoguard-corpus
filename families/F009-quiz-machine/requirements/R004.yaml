  "name": "seeded_order",
  "introduced_at": "T002",
  "status": "active",
  "description": "Permitir fijar el orden de presentación con una semilla entera de 0 a 96 (campo «Semilla», vacío al cargar) y el botón «Aplicar semilla». Con una semilla s de 1 a 96, las preguntas se ordenan por la clave ((i + 1) · s) mod 97, donde i es la posición de la pregunta en el fixture empezando en 0, de menor a mayor clave; a igual clave, por posición en el fixture. Una semilla vacía o 0 restablece el orden del fixture. Aplicar una semilla válida reinicia el cuestionario (primera pregunta del nuevo orden, puntuación 0, sin resultado ni revisión). Si el valor no es un entero de 0 a 96 se muestra un aviso y no cambia nada (ni el orden, ni la pregunta, ni la puntuación). Reiniciar conserva el orden de la semilla aplicada. La revisión sigue el orden en que se presentaron las preguntas. Sin semilla aplicada el orden es el del fixture.",
