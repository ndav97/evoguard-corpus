        "rule": "Las devoluciones se muestran en una lista con nombre accesible «Historial», la más reciente primero."
      },
      {
        "role": "listitem",
        "name": null,
        "rule": "Cada devolución es un <li> de «Historial» cuyo texto comienza con el ID del libro e incluye «prestado día n, devuelto día m», p. ej. «L003 prestado día 1, devuelto día 5»."
      }
    ]
  }
}
