      },
      {
        "role": "combobox",
        "name": "Duración",
        "rule": "Un <select> con nombre accesible «Duración» y opciones de valor 30, 60, 90 y 120 (minutos); valor inicial 60."
      },
      {
        "role": "button",
        "name": "Reservar",
        "rule": "Un botón «Reservar» que intenta crear la reserva en la sala y el día seleccionados."
      },
      {
        "role": "alert",
        "name": null,
        "rule": "Si el título está vacío tras recortar, aparece un elemento con role=\"alert\" cuyo texto contiene «El título es obligatorio». Si la reserva terminaría después de las 19:00, su texto contiene «La reserva termina después del cierre». Si se solapa con otra reserva, su texto contiene «La reserva se solapa con» seguido del ID de la reserva en conflicto (si hay varias, la de inicio más temprano). En todos los casos no se crea la reserva."
      }
