  "description": "Mostrar la calificación en letra de cada estudiante y la distribución de letras. La letra se calcula sobre la nota final ya redondeada a dos decimales: A si es ≥ 90, B si es ≥ 80, C si es ≥ 70, D si es ≥ 60 y F en otro caso. Un resumen «Distribución» cuenta cuántos estudiantes tienen cada letra, considerando todos los estudiantes. Letras y distribución se actualizan al cambiar las puntuaciones.",
