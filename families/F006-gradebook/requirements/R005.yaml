  "description": "Identificar a los estudiantes en riesgo: los que tienen una nota final redondeada menor que 60.00 o alguna tarea no entregada. Un resumen «En riesgo» muestra cuántos hay, contando siempre a todos los estudiantes. La casilla «Solo en riesgo» (desmarcada al cargar) limita la lista a los estudiantes en riesgo, en el orden del fixture; no afecta a los resúmenes. Todo se actualiza al editar puntuaciones y al aplicar pesos.",
