  "status": "active",
  "description": "Fijar notas. Cada nota tiene un botón «Fijar» que alterna su estado de fijada; el botón expone ese estado con aria-pressed (\"true\" fijada, \"false\" no fijada). La lista muestra primero las notas fijadas y después las demás; dentro de cada grupo se conserva el orden de las notas (fixture y luego creadas), con independencia del orden en que se fijaron. Al dejar de estar fijada, una nota vuelve a su posición en ese orden. El orden por fijado se aplica también a los resultados de la búsqueda y del filtro de etiqueta. El estado de fijado se guarda con las notas y se conserva al recargar.",
