<!doctype html>
<html lang="es">
<body>
  <main>
    <label>Buscar <input type="search" /></label>
    <label>Categoría
      <select>
        <option>All</option>
        <option>Home</option>
      </select>
    </label>
    <label>Orden
      <select>
        <option>name-asc</option>
        <option>price-asc</option>
      </select>
    </label>
    <button type="button">Anterior</button>
    <button type="button">Siguiente</button>
    <ul>
      <li><button type="button">P010 Desk Lamp</button></li>
      <li><button type="button">P011 Coffee Grinder</button></li>
    </ul>
    <p role="status"></p>
  </main>
  <script>
    const [previous, next] = document.querySelectorAll('main > button');
    previous.disabled = true;
    const status = document.querySelector('[role="status"]');
    for (const button of document.querySelectorAll('li button')) {
      button.addEventListener('click', () => { status.textContent = button.textContent; });
    }
    next.addEventListener('click', () => { previous.disabled = false; next.disabled = true; });
    previous.addEventListener('click', () => { previous.disabled = true; next.disabled = false; });
  </script>
</body>
</html>
