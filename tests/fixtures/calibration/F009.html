<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Calibración F009 (solo pruebas del oráculo)</title></head>
<body>
  <!-- Página de calibración del oráculo F009. Material de prueba: no es referencia V0–V3 ni se entrega al constructor.
       Parámetros: ?version=V0|V1|V2|V3 (por defecto V3) y ?mutant=<defecto deliberado> para controles negativos. -->
  <main>
    <section id="seedbox" hidden>
      <label>Semilla <input type="number" id="seed"></label>
      <button type="button" id="apply">Aplicar semilla</button>
      <p id="error" role="alert" hidden></p>
    </section>
    <p id="question" role="status" aria-label="Pregunta"></p>
    <fieldset id="options"></fieldset>
    <button type="button" id="answer">Responder</button>
    <p id="result" role="status" aria-label="Resultado" hidden></p>
    <button type="button" id="next" hidden>Siguiente</button>
    <p id="score" role="status" aria-label="Puntuación"></p>
    <p id="final" role="status" aria-label="Final" hidden></p>
    <button type="button" id="review" hidden>Revisar</button>
    <ul id="reviewList" aria-label="Revisión" hidden></ul>
    <p id="streak" role="status" aria-label="Racha actual" hidden></p>
    <p id="best" role="status" aria-label="Mejor racha" hidden></p>
    <button type="button" id="restart">Reiniciar</button>
  </main>
  <script>
    const FIXTURE = [{"id":"Q001","topic":"geografía","prompt":"¿Cuál es la capital de Australia?","options":["Sídney","Canberra","Melbourne","Perth"],"answer":1},{"id":"Q002","topic":"ciencia","prompt":"¿Qué gas absorben las plantas en la fotosíntesis?","options":["Oxígeno","Nitrógeno","Dióxido de carbono","Helio"],"answer":2},{"id":"Q003","topic":"historia","prompt":"¿En qué año llegó el ser humano a la Luna?","options":["1969","1965","1972","1958"],"answer":0},{"id":"Q004","topic":"matemáticas","prompt":"¿Cuánto es 7 × 8?","options":["54","48","64","56"],"answer":3},{"id":"Q005","topic":"geografía","prompt":"¿Cuál es el río más largo de Europa?","options":["Danubio","Volga","Rin","Loira"],"answer":1},{"id":"Q006","topic":"ciencia","prompt":"¿Cuál es el símbolo químico del oro?","options":["Au","Ag","Fe","Pb"],"answer":0},{"id":"Q007","topic":"historia","prompt":"¿Quién pintó «Las meninas»?","options":["Goya","El Greco","Velázquez","Murillo"],"answer":2},{"id":"Q008","topic":"matemáticas","prompt":"¿Cuál es el siguiente número primo después de 13?","options":["15","19","21","17"],"answer":3},{"id":"Q009","topic":"geografía","prompt":"¿En qué continente está Kenia?","options":["África","Asia","Oceanía","América"],"answer":0},{"id":"Q010","topic":"ciencia","prompt":"¿Cuántos huesos tiene el cuerpo humano adulto?","options":["186","212","198","206"],"answer":3},{"id":"Q011","topic":"historia","prompt":"¿En qué ciudad se firmó la Declaración de Independencia de Estados Unidos?","options":["Boston","Filadelfia","Nueva York","Washington"],"answer":1},{"id":"Q012","topic":"matemáticas","prompt":"¿Cuánto mide cada ángulo interior de un triángulo equilátero?","options":["45 grados","90 grados","60 grados","30 grados"],"answer":2}];
    const params = new URLSearchParams(location.search);
    const level = Number((params.get('version') || 'V3').slice(1));
    const mutant = params.get('mutant') || '';
    const $ = id => document.getElementById(id);
    const TOTAL = FIXTURE.length;

    // Estado de la sesión: fase question | answered | final.
    let seed = 0;
    let order = FIXTURE.map((_, i) => i);
    let pos = 0, phase = 'question', selected = null, score = 0, answers = [], reviewShown = false, streak = 0, best = 0;
    let pendingPoint = 0; // mutante score-on-next

    function computeOrder(s) {
      const offset = mutant === 'seed-plus' ? 0 : 1;
      return FIXTURE.map((_, i) => ({ i, key: ((i + offset) * s) % 97 })).sort((a, b) => a.key - b.key || a.i - b.i).map(x => x.i);
    }
    function current() { return FIXTURE[order[pos]]; }

    function restart({ keepScore = false } = {}) {
      pos = 0; phase = 'question'; selected = null; pendingPoint = 0;
      if (!keepScore) score = 0;
      if (mutant !== 'review-accumulate') answers = [];
      reviewShown = false;
      streak = 0;
      if (mutant === 'best-reset') best = 0;
    }

    function answer() {
      if (phase !== 'question' || selected === null) return;
      const q = current();
      const reference = mutant === 'grade-index' ? FIXTURE[order[Math.max(0, pos - 1)]] : q;
      const ok = selected === reference.answer;
      const last = pos === order.length - 1;
      if (ok || mutant === 'score-answered') {
        if (mutant === 'score-on-next') pendingPoint = 1;
        else if (!(mutant === 'last-uncounted' && last)) score++;
      }
      if (ok) streak++;
      else if (mutant !== 'streak-no-reset') streak = 0;
      if (mutant === 'best-on-fail') { if (!ok) best = Math.max(best, lastStreak); }
      else best = Math.max(best, streak);
      lastStreak = streak;
      if (!(mutant === 'review-last-missing' && last)) answers.push({ q, chosen: selected, ok });
      phase = 'answered';
      render();
    }
    let lastStreak = 0;

    function next() {
      if (phase !== 'answered') return;
      score += pendingPoint; pendingPoint = 0;
      const end = mutant === 'end-early' ? order.length - 2 : order.length - 1;
      if (pos >= end) phase = 'final';
      else {
        pos++; phase = 'question';
        if (mutant !== 'keep-choice') selected = null;
      }
      render();
    }

    function renderOptions() {
      const box = $('options');
      box.replaceChildren();
      box.hidden = phase === 'final';
      if (phase === 'final') return;
      const q = current();
      q.options.forEach((text, index) => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio'; input.name = 'opt';
        input.checked = selected === index;
        input.disabled = phase === 'answered' && mutant !== 'no-lock';
        input.onchange = () => { if (phase === 'question' || mutant === 'no-lock') { selected = index; render(); } };
        label.append(input, ' ' + text);
        box.append(label);
      });
    }

    function render() {
      const final = phase === 'final';
      const q = final ? null : current();
      $('question').hidden = final;
      $('question').textContent = final ? '' : `${q.id} ${q.prompt}`;
      renderOptions();
      $('answer').hidden = final;
      $('answer').disabled = mutant === 'answer-enabled' ? phase !== 'question' : !(phase === 'question' && selected !== null);
      const showResult = phase === 'answered' || (mutant === 'result-stale' && answers.length > 0 && !final);
      $('result').hidden = !showResult;
      if (phase === 'answered') {
        const a = answers[answers.length - 1] || { ok: false };
        const ok = mutant === 'review-last-missing' && pos === order.length - 1 ? selected === q.answer : a.ok;
        $('result').textContent = `${ok ? 'Correcto' : 'Incorrecto'}. Respuesta correcta: ${q.options[q.answer]}`;
      }
      $('next').hidden = phase !== 'answered';
      $('score').hidden = final;
      $('score').textContent = `Puntuación: ${score}/${TOTAL}`;
      $('final').hidden = !final;
      $('final').textContent = `Puntuación final: ${score} de ${TOTAL}`;
      $('review').hidden = !(level >= 1 && final);
      const showList = level >= 1 && final && (reviewShown || mutant === 'review-early');
      $('reviewList').hidden = !showList;
      $('reviewList').replaceChildren();
      if (showList) {
        let rows = answers.slice();
        if (mutant === 'review-sorted') rows.sort((a, b) => a.q.id.localeCompare(b.q.id));
        for (const a of rows) {
          const li = document.createElement('li');
          const chosen = a.q.options[a.chosen], correct = a.q.options[a.q.answer];
          const [shownChosen, shownCorrect] = mutant === 'review-swap' ? [correct, chosen] : [chosen, correct];
          li.textContent = `${a.q.id} ${a.ok ? 'Correcta' : 'Incorrecta'} · Elegida: ${shownChosen} · Respuesta correcta: ${shownCorrect}`;
          $('reviewList').append(li);
        }
      }
      $('seedbox').hidden = level < 2;
      const streaksVisible = level >= 3 && !(mutant === 'streak-hidden-final' && final);
      $('streak').hidden = !streaksVisible;
      $('best').hidden = !streaksVisible;
      $('streak').textContent = `Racha actual: ${streak}`;
      $('best').textContent = `Mejor racha: ${best}`;
    }

    $('answer').onclick = answer;
    $('next').onclick = next;
    $('review').onclick = () => { reviewShown = true; render(); };
    $('restart').onclick = () => {
      if (mutant === 'seed-restart-original') order = FIXTURE.map((_, i) => i);
      restart({ keepScore: mutant === 'restart-keeps-score' });
      render();
    };
    $('apply').onclick = () => {
      const raw = $('seed').value.trim();
      const max = mutant === 'seed-range' ? 97 : 96;
      if (raw !== '' && !(/^\d+$/.test(raw) && Number(raw) <= max)) {
        $('error').textContent = 'La semilla debe ser un número entero entre 0 y 96';
        $('error').hidden = false;
        return;
      }
      $('error').hidden = true;
      seed = raw === '' ? 0 : Number(raw);
      order = computeOrder(seed);
      const keptStreak = streak;
      restart({ keepScore: mutant === 'seed-norestart' });
      if (mutant === 'seed-keeps-streak') streak = keptStreak;
      render();
    };
    render();
  </script>
</body>
</html>
