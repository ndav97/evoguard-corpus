  "status": "active",
  "description": "Eliminar notas con posibilidad de deshacer la última eliminación. Cada nota tiene un botón «Eliminar» que la quita de inmediato; la eliminación se guarda y se conserva al recargar. El botón «Deshacer eliminación» restaura solo la nota eliminada en último lugar, en la misma posición que ocupaba en el orden de las notas y con todos sus datos, incluido su estado de fijado; tras deshacer ya no hay nada que deshacer (no se pueden recuperar eliminaciones anteriores). Crear una nota o recargar la página descarta la posibilidad de deshacer. «Deshacer eliminación» está deshabilitado cuando no hay nada que deshacer. Las etiquetas del filtro reflejan siempre las notas existentes. La numeración de las notas nuevas sigue la regla de creación (mayor ID existente más uno).",
