      "description": "Filtro de etiqueta y búsqueda se combinan: solo se muestran las notas que cumplen ambos."
    },
    {
      "id": "R003-A05",
      "description": "Las etiquetas de una nota nueva se recortan, pasan a minúsculas y se descartan vacías y repetidas; la etiqueta nueva aparece en el filtro y el campo queda vacío."
    },
    {
      "id": "R003-A06",
      "description": "Las etiquetas de las notas creadas se conservan al recargar."
    }
  ],
