{
  "schema_version": "1.0.0",
  "id": "R003",
  "name": "note_tags",
  "introduced_at": "T001",
  "status": "active",
  "description": "Etiquetar notas y filtrar por etiqueta. Al crear una nota se pueden indicar etiquetas en el campo «Etiquetas», separadas por comas: cada una se recorta, se pasa a minúsculas, se descartan las vacías y las repetidas (se conserva la primera aparición); el campo empieza vacío, una nota sin etiquetas es válida y el campo queda vacío tras guardar. El texto de cada nota de la lista muestra sus etiquetas en su orden, cada una como «#etiqueta». El selector «Filtrar etiqueta» ofrece la opción «todas» y una opción por cada etiqueta presente en las notas existentes, en orden alfabético; con una etiqueta seleccionada solo se ven las notas que la tienen. El filtro se combina con la búsqueda: se muestran las notas que cumplen ambos. El orden de la lista no cambia. Las etiquetas se guardan con las notas y se conservan al recargar.",
  "acceptance": [
    {
      "id": "R003-A01",
      "description": "Cada nota muestra sus etiquetas como «#etiqueta»."
    },
    {
      "id": "R003-A02",
