  "status": "active",
  "description": "Reglas que cruzan campos de distintos pasos. (1) El plan Equipo exige un correo de empresa: si el dominio del correo (lo que sigue a la arroba, sin distinguir mayúsculas) está en `free_email_domains`, «Enviar» no envía y muestra un aviso; con otros planes esos dominios se aceptan. (2) Si el plan elegido deja de estar permitido por la edad (p. ej. se eligió Pro, se vuelve atrás y se baja la edad por debajo de 18), el plan vuelve a Básico. (3) Si la parte del correo anterior a la arroba tiene 3 o más caracteres, la contraseña no puede contenerla (sin distinguir mayúsculas): «Siguiente» en Cuenta no avanza y muestra un aviso; la regla solo se comprueba con un correo válido. (4) La confirmación incluye además «Plan: <nombre>» del plan enviado.",
