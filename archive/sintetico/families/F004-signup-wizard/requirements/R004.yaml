  "name": "plan_selection",
  "introduced_at": "T002",
  "status": "active",
  "description": "En el paso Resumen (sin añadir pasos nuevos) se elige el plan con un grupo de botones de opción con los planes del fixture en su orden; Básico está seleccionado por defecto. Un plan con edad mínima (`min_age`) mayor que la edad introducida está deshabilitado (Pro exige 18 años). Si se elige un plan que requiere empresa (Equipo), aparece un campo «Empresa» obligatorio (no vacío tras recortar espacios); con otro plan el campo no se muestra y la empresa no aparece en el Resumen. El Resumen incluye «Plan: <nombre>» y «Precio mensual: N» (dos decimales) y, con Equipo, «Empresa: <nombre recortado>». «Enviar» valida: con Equipo y la empresa vacía no se envía y se muestra un aviso. El plan elegido se conserva al ir Atrás y volver a Resumen.",
  "acceptance": [
    {
      "id": "R004-A01",
      "description": "Al llegar a Resumen, Básico está seleccionado y el Resumen muestra su plan y precio mensual."
    },
    {
      "id": "R004-A02",
      "description": "Pro está deshabilitado con edad 17 y habilitado con edad 18."
    },
    {
      "id": "R004-A03",
