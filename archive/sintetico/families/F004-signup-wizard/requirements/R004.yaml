      "description": "Con Equipo, la empresa es obligatoria para enviar (no vale solo con espacios)."
    },
    {
      "id": "R004-A05",
      "description": "Equipo muestra el campo Empresa y la incluye en el Resumen; volver a Básico la oculta y la quita del Resumen."
    },
    {
      "id": "R004-A06",
      "description": "El plan elegido se conserva al ir Atrás y volver a Resumen."
    }
  ],
  "ui_contract": {
