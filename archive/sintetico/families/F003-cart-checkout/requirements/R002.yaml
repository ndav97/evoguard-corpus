  "status": "active",
  "description": "Editar la cantidad de cada línea del carrito con su campo «Cantidad» (entero de 0 a 99). Al cambiar la cantidad el subtotal se actualiza de inmediato, sin botón de confirmación. Una cantidad 0 elimina la línea. Cada línea tiene además un botón «Quitar» que la elimina. Las demás líneas conservan su orden y cantidad. Si se vuelve a añadir un producto eliminado, su línea empieza de nuevo con cantidad 1 al final del carrito. Añadir desde el catálogo un producto cuya cantidad se ha editado suma 1 a la cantidad actual.",
