  "description": "Elegir la región de entrega en un selector con las regiones del fixture, en su orden (la primera, Península, seleccionada al cargar). El impuesto se calcula como (subtotal − descuento) × `tax_rate` de la región elegida, redondeado al céntimo (0,5 hacia arriba), y se actualiza con cada cambio del carrito, del cupón o de la región. Cambiar la región no modifica el subtotal ni el descuento. Con el carrito vacío el impuesto es 0.00.",
